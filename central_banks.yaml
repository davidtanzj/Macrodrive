# MacroDrive central bank meeting schedule.
#
# Version-controlled source of truth for central bank policy-meeting dates.
# To update for a new year, add new `events` entries (or a new year block)
# and commit. The loader converts each local `time` to UTC and only surfaces
# events whose scheduled_at is in the future.
#
# Dates below are transcribed from each bank's official published schedule
# (see `source_url`). Spot-check them against the source before relying on
# them; a few banks (e.g. BoT, Riksbank) publish partial/rolling schedules.

