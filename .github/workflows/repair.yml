name: Rebuild MacroDrive Classifications

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset article classifications
        run: |
          python - <<'PY'
          from db import connect_database

          connection = connect_database()
          cursor = connection.cursor()

          cursor.execute("""
              UPDATE articles
              SET
                  macro_relevant = NULL,
                  relevance_score = NULL,
                  region_processed = 0
          """)

          cursor.execute("""
              DELETE FROM article_categories
          """)

          cursor.execute("""
              DELETE FROM article_regions
          """)

          connection.commit()
          connection.close()

          print(
              "Classification markers reset successfully.",
              flush=True
          )
          PY

      - name: Rebuild topic classifications
        run: python -u processor.py

      - name: Rebuild region classifications
        run: python -u regionprocessor.py